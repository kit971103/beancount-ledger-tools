# Build the fava image and roll it out to the Cloud Run service that
# deploy/gcp/deploy.sh created; deploy/gcp/ci-setup.sh grants this workflow
# access and prints the variables it reads from the `gcp-deployment` environment.  Only the image changes:
# the service keeps its account, environment, secret and IAP settings.
name: deploy-gcp

on:
  push:
    branches: [main]
    paths:
      - src/**
      - pyproject.toml
      - deploy/container/**
      - .github/workflows/deploy-gcp.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token exchanged for the deployer account

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped in forks.  (The environment's variables are not yet visible here.)
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-deployment # holds the variables ci-setup.sh prints
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-west1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/ledger/fava:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >>"$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f deploy/container/Dockerfile -t "$IMAGE" \
            --build-arg LEDGER_TOOLS_COMMIT="$GITHUB_SHA" .
          docker push "$IMAGE"

      - name: Deploy
        run: gcloud run deploy ledger-fava --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE"
