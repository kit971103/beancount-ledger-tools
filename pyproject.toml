[project]
name = "beancount-ledger-tools"
version = "0.1.0"
description = "Beancount plugins, fava extensions and statement extractors for a personal double-entry ledger"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2.3",
    "beanquery>=0.2.0",
    "fava>=1.30.16",
    "beancount-reds-plugins>=0.4.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
fetch = ["playwright>=1.47"]

[project.scripts]
ledger-extract = "ledger_tools.cli:extract"
ledger-fetch = "ledger_tools.fetch.fetch:main"
ledger-prices = "ledger_tools.prices:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_tools"]
